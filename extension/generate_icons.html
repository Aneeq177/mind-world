<!DOCTYPE html>
<html>
<body>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
  ['16','48','128'].forEach(size => {
    const canvas = document.getElementById('c' + size)
    const ctx = canvas.getContext('2d')
    const s = parseInt(size)

    // Background
    ctx.fillStyle = '#0a0a14'
    ctx.beginPath()
    ctx.roundRect(0, 0, s, s, s * 0.2)
    ctx.fill()

    // Globe emoji approximation
    ctx.fillStyle = '#7c3aed'
    ctx.beginPath()
    ctx.arc(s/2, s/2, s*0.35, 0, Math.PI * 2)
    ctx.fill()

    ctx.fillStyle = '#a78bfa'
    ctx.beginPath()
    ctx.arc(s/2, s/2, s*0.2, 0, Math.PI * 2)
    ctx.fill()

    // Download
    const link = document.createElement('a')
    link.download = 'icon' + size + '.png'
    link.href = canvas.toDataURL()
    link.click()
  })
</script>
</body>
</html>
