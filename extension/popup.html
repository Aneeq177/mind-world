<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="popup">
    <div id="header">
      <span>🌍</span>
      <span>Mind World</span>
    </div>
    <div id="status-section">
      <div id="status-dot"></div>
      <div id="status-text">Active on claude.ai</div>
    </div>
    <div id="email-section">
      <div id="email-label">Connected as</div>
      <div id="email-value">Loading...</div>
    </div>
    <div id="divider"></div>
    <div id="instructions">
      <p>Start typing in Claude and Mind World will automatically surface relevant past conversations.</p>
      <p>Click <strong>⚡ Inject Context</strong> to add a past conversation to your current chat.</p>
    </div>
    <a href="https://mind-world-indol.vercel.app"
       target="_blank"
       id="open-map">
      🌍 Open Mind World Map
    </a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
